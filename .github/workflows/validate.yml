name: Validate 3D scene

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts, scene assembly and mechanics
        run: |
          npm ci
          npm test
